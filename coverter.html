<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Converter</title>
</head>
<body>
    <h2>Convert Word File to PDF</h2>
    <input type="file" id="wordDosyasi">
    <button id="convertBtn">Convert</button>
    <p id="sonuc"></p>

    <script>
        async function convertFile() {
            const fileInput = document.getElementById('wordDosyasi');
            const sonuc = document.getElementById('sonuc');

            // STEP 1: Was a file selected?
            if (!fileInput.files[0]) {
                alert("No file selected!");
                return;
            }

            // STEP 2: Is the file type .doc or .docx?
            const file = fileInput.files[0];
            const allowedTypes = ['.doc', '.docx'];
            const fileName = file.name.toLowerCase();
            if (!allowedTypes.some(ext => fileName.endsWith(ext))) {
                alert("Please select only .doc or .docx files!");
                return;
            }

            // STEP 3: Inform the user
            sonuc.textContent = "Processing, please wait...";

            // STEP 4: Create FormData
            const formData = new FormData();
            formData.append('file', file);

            try {
                // ✅ CORRECT ENDPOINT
                const response = await fetch('https://api.apyhub.com/convert/word-file/pdf-url?output=donusturuldu', {
                    method: 'POST',
                    headers: {
                        'apy-token': 'APY0Cu333YcnSpz1PAJO8sXIT7qOnmNDJUvyKhyBt72x7VXPNyeqm2pGm7qBW0yDdh'
                    },
                    body: formData
                });

                if (response.ok) {
                    // ✅ API returns a URL, not a blob
                    const data = await response.json();
                    const pdfUrl = data.data; // returned URL here

                    // Click the link to download the file
                    const a = document.createElement('a');
                    a.href = pdfUrl;
                    a.download = "converted.pdf";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    sonuc.textContent = "Success! File downloaded.";
                } else {
                    const errorData = await response.text();
                    sonuc.textContent = "Error Details: " + errorData;
                    console.error("API Error:", errorData);
                }
            } catch (error) {
                sonuc.textContent = "Connection Error: " + error.message;
            }
        }

        document.getElementById('convertBtn').addEventListener('click', convertFile);
    </script>
</body>
</html>
